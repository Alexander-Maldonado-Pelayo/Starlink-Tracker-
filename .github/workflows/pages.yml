name: Deploy demo to GitHub Pages

# Publishes docs/ (the self-contained Starlink Watch map) to GitHub Pages so
# anyone can open the demo at a public URL with no install. One-time setup:
# repo Settings ▸ Pages ▸ Build and deployment ▸ Source: "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/local-demo-setup-fx9v3g
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

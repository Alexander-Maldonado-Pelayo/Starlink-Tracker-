name: Refresh TLE catalog

# Pulls the latest Starlink TLEs from CelesTrak and the non-Starlink "active"
# catalog every two hours, writing into Turso. The dashboard reads from Turso
# on every page load, so the deploy never depends on live Space-Track or
# CelesTrak responses at user-request time.
#
# Required repo secrets:
#   TURSO_URL              libsql:// URL of the production database
#   TURSO_AUTH_TOKEN       service-token auth for Turso
#   SPACETRACK_IDENTITY    Space-Track.org login (fallback if CelesTrak is down)
#   SPACETRACK_PASSWORD    Space-Track.org password

on:
  # Hands-free refresh every two hours, plus on-demand from
  # Actions ▸ Refresh TLE catalog ▸ Run workflow (or `gh workflow run`).
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Cancel an in-flight run if a new one starts, to avoid stepping on ourselves.
concurrency:
  group: refresh-tles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      SPACETRACK_IDENTITY: ${{ secrets.SPACETRACK_IDENTITY }}
      SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install spacetrack + Turso client
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[turso]"

      - name: Refresh Starlink TLEs (CelesTrak)
        # The 'update' command 403s gracefully when CelesTrak says no new
        # data. We don't fail the whole job for that — the rest of the
        # refresh (catalog update) is still worth running.
        continue-on-error: true
        run: spacetrack update

      - name: Refresh non-Starlink catalog (CelesTrak `active` group)
        continue-on-error: true
        run: spacetrack update-catalog

      # Run the cheap, constellation-wide detectors (maneuver, inspector,
      # decay) on every refresh. ~15 s for the whole constellation; commits in
      # its own transaction so it can't be rolled back by a slow conjunction
      # sweep below.
      - name: Detect maneuvers / residuals / decay (full constellation)
        continue-on-error: true
        run: spacetrack scan --no-conjunction

      # Conjunction screening is several seconds/primary against the full
      # debris-inclusive catalog — too slow to cover all ~10k Starlink per run.
      # Screen a rotating window of 250 primaries; the offset advances with the
      # run number so successive runs sweep the whole constellation on a rolling
      # basis (~every 3-4 days at this cadence). The step has its own timeout
      # and continue-on-error so a long sweep can never fail the job or block
      # the stats report — the cheap detectors above already committed.
      - name: Screen conjunctions (rotating window)
        continue-on-error: true
        timeout-minutes: 20
        env:
          RUN_NUMBER: ${{ github.run_number }}
          WINDOW: "250"
        run: |
          OFFSET=$(( RUN_NUMBER * WINDOW ))
          echo "Conjunction window: ${WINDOW} primaries from offset ${OFFSET}"
          spacetrack scan \
            --no-maneuver --no-inspector --no-decay \
            --conjunction-min-risk medium \
            --conjunction-primary-limit "${WINDOW}" \
            --conjunction-primary-offset "${OFFSET}"

      - name: Report final DB stats
        run: spacetrack stats
